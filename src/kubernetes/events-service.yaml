apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: cinemaabyss
  labels:
    app: events-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: events-service

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: events-service

    spec:
      containers:
        - name: events-service
          image: ghcr.io/chernovkote/architecture-pro-cinemaabbyss/events-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8082

          env:
            - name: KAFKA_BROKERS
              value: "kafka:9092"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /api/events/health
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/events/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/events/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

      imagePullSecrets:
        - name: dockerconfigjson

---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  namespace: cinemaabyss

spec:
  selector:
    app: events-service

  ports:
    - name: http
      port: 8082
      targetPort: 8082

  type: ClusterIP